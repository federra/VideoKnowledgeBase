[project]
name = "content-intelligence-backend"
version = "0.1.0"
description = "内容智能服务系统后端基础"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn[standard]>=0.41,<1",
    "pydantic-settings>=2.13,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.6,<5.7",
    "httpx>=0.28,<1",
    "fonttools>=4.60,<5",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.15,<1",
    "redis>=6,<8",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
markers = ["database: isolated real PostgreSQL acceptance"]

[tool.ruff]
target-version = "py312"
line-length = 100
