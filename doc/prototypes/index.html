/* 用户参考主题：仅调整视觉变量与样式，保留全部正文、模块和行为。 */
:root{
  color-scheme:light;
  --canvas:#f8f9fb;--surface:#ffffff;--chrome:#f8f9fb;--sidebar-bg:#ffffff;
  --ink:#22252c;--muted:#616670;--line:#e2e4e9;--fill:#f1f2f4;
  --teal:#b83a22;--selected:#fff5f1;--accent:#d33c21;--accent-hover:#b9311b;
  --brand:#ff4b2b;--primary-on:#ffffff;--accent-on:#ffffff;
  --spark-bg:#6352d5;--spark-hover:#5140b8;--spark-on:#ffffff;
  --nav-text:#4f5d70;--nav-active:#fff5f1;--nav-on:#ff3b1f;--nav-line:#ffb8a5;
  --card-rule:#eceef1;--tag-line:#e2e4e9;--notice-bg:#fff8f4;--notice-line:#f1d9d0;
  --plot:#a9432c;--green:#b83a22;--green-soft:#fff5f1;--violet:#b83a22;--violet-soft:#fff5f1;
  --scrim:rgba(23,25,31,.35);--shadow:none;--popup-shadow:0 16px 42px rgba(29,31,38,.12);
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#101216;--surface:#1b1e26;--chrome:#101216;--sidebar-bg:#1b1e26;
  --ink:#eceef2;--muted:#b0b4bd;--line:#343944;--fill:#232731;
  --teal:#ff987a;--selected:#35241e;--accent:#d33c21;--accent-hover:#b9311b;
  --brand:#ff4b2b;--primary-on:#ffffff;--accent-on:#ffffff;
  --spark-bg:#7564dc;--spark-hover:#6352c8;--spark-on:#ffffff;
  --nav-text:#b4bfce;--nav-active:#35241e;--nav-on:#ff6047;--nav-line:#a9563f;
  --card-rule:#2e333e;--tag-line:#414754;--notice-bg:#28201f;--notice-line:#51372e;
  --plot:#ffad93;--green:#ff987a;--green-soft:#35241e;--violet:#ff987a;--violet-soft:#35241e;
  --scrim:rgba(5,7,11,.7);--shadow:none;--popup-shadow:0 18px 48px rgba(0,0,0,.38);
}
body{font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font-family:var(--font)}
button{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.9}
::selection{background:var(--selected);color:var(--teal)}
.sidebar{background:var(--sidebar-bg);padding:28px 14px 18px}
.brand{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0 10px 38px}
.brand-mark{width:36px;height:36px;background:var(--brand);border-color:var(--brand);color:#ffffff;border-radius:12px}
.nav-label{font-size:12px;font-weight:500;letter-spacing:normal;padding:0 13px;margin-bottom:14px}
.nav{gap:10px}
.nav button{position:relative;border:1px solid transparent;border-radius:12px;padding:14px 13px;color:var(--nav-text);font-weight:550}
.nav button:hover{background:var(--fill);color:var(--nav-text)}
.nav button.active{background:var(--nav-active);color:var(--nav-on);border-color:transparent;font-weight:700}
.nav button.active:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:3px;background:var(--nav-on);pointer-events:none}
.nav button.active:after{display:none}
.nav button .icon{width:20px;height:20px}
.nav button .icon{color:inherit}
.nav button .nav-solid{fill:currentColor;stroke:none}
.side-note{margin-left:10px;margin-right:10px;border-color:var(--line);line-height:1.9}
.profile{padding:14px 10px;font-size:13px}
.avatar{background:var(--fill);color:var(--muted);border:1px solid var(--line);font-weight:600}
.topbar{position:sticky;top:0;z-index:12;background:var(--chrome);min-height:58px;padding:8px 28px;gap:16px;border-bottom-color:var(--line)}
.top-context{gap:20px}
.breadcrumb{font-size:13px;gap:10px}
#crumb{color:var(--muted)}
#crumbTab{font-weight:600}
.top-actions{gap:10px}
.prototype{background:var(--surface);padding:6px 10px;border-radius:10px;color:var(--muted)}
.workspace-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:264px;padding:0;border:0;border-radius:0;background:transparent;gap:6px}
.workspace-options button{padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-weight:500;min-height:29px;line-height:19px}
.workspace-options button.active{background:var(--selected);color:var(--teal);border-color:var(--brand);box-shadow:none;font-weight:600}
html[data-theme="dark"] .workspace-options button.active{background:var(--selected);color:var(--teal)}
.workspace-label{font-size:12px;font-weight:500}
.workspace{padding:28px 28px 96px}
.tabs{display:flex;width:fit-content;max-width:100%;gap:8px;padding:0;border:0;border-radius:0;background:transparent;margin-bottom:24px}
.tabs button{padding:5px 17px;border:1px solid var(--line);border-radius:999px;background:var(--surface);line-height:21px;min-height:33px;font-size:14px;color:var(--muted);font-weight:500}
.tabs button.active{background:var(--selected);border-color:var(--brand);color:var(--teal);box-shadow:none;font-weight:600}

.console-config-card h2{font-size:15px}
.console-config-card p{font-size:12px;line-height:1.6}
.console-config-card .btn{font-size:12px}
.page-heading.page-actions{justify-content:flex-end}
.topic-grid{gap:18px}
.topic-grid .card{display:flex;flex-direction:column;min-width:0}

.empty,.lane-empty{background:var(--surface);border-radius:16px}

.footer{margin-top:28px;font-size:12px;border-color:var(--line)}

.dialog-body{line-height:1.75}
.detail-title{font-size:18px;font-weight:650;letter-spacing:-.02em}
.detail-block h3{font-size:15px;font-weight:600}

.review-summary .rank-plot{font-weight:500;color:var(--plot)}
.review-stats div{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--fill);border-radius:12px}
.review-stats dd{font-size:18px;font-weight:650}
.review-option{border-radius:999px}.spark-note,.board-config-item{border-radius:12px}
.review-option:has(input:checked){border-color:var(--nav-line);background:var(--selected)}
.review-form .field>label,.review-form fieldset legend{font-weight:600}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{background:var(--canvas)}
.evidence{background:var(--canvas);font-size:13px}
.steps span{border-radius:999px;background:var(--fill);font-weight:500}
.steps span.done{border-color:var(--nav-line);background:var(--selected);color:var(--teal)}
.bar{height:6px}
.bar i{background:var(--teal)}
.score-line:nth-of-type(2) .bar i{background:var(--green)}
.score-line:nth-of-type(3) .bar i{background:var(--violet)}
.spark-float{border-radius:999px;background:var(--spark-bg);border-color:var(--spark-bg);color:var(--spark-on);box-shadow:var(--popup-shadow);font-size:13px;padding:13px 16px}
.spark-float:hover{background:var(--spark-hover);filter:none}

.toast{background:var(--ink);color:var(--primary-on);border-radius:12px;box-shadow:var(--popup-shadow)}

html[data-theme="dark"] .cards-grid:not(.topic-grid)>.card{
  --surface:#ffffff;--ink:#22252c;--muted:#616670;--line:#e2e4e9;--fill:#f1f2f4;

/* 评审批注：紧凑顶栏与元信息、标签共行。 */
.topbar{height:auto;min-height:58px}
.top-context{flex-direction:row;align-items:center;flex-basis:auto}
.top-actions{justify-content:flex-end;flex-wrap:wrap;min-width:0}
.top-actions .business-workspace{width:auto;max-width:100%;flex:none}
.top-actions .workspace-options{flex:0 1 264px;min-width:0}
.feed-card-context{display:flex;align-items:center;gap:12px;flex:0 1 auto;min-width:0}
.feed-single .feed-card-context .feed-meta{order:0;margin:0;gap:16px;min-width:0}
.feed-card-context .feed-card-tags{order:0;width:auto;margin:0;flex:none}

  .feed-single .rank-main{flex-wrap:wrap;row-gap:2px}

/* 情报日期与关键操作：渐变红只用于研判及加入待生产。 */
:root{--action-gradient:linear-gradient(135deg,#bb4947,#aa3c50);--action-gradient-hover:linear-gradient(135deg,#b44243,#983347);--production-gradient:linear-gradient(105deg,#c24d24 0%,#9e2855 100%);--production-gradient-hover:linear-gradient(105deg,#b34320 0%,#8b214b 100%)}
.workspace-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.workspace-nav .tabs{margin-bottom:0}
#feedDateTools{margin-left:auto}
#feedDateTools:empty{display:none}
.feed-date-filter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.feed-date-filter input{height:33px;min-width:142px;padding:4px 9px;font-size:12px}
.feed-date-filter .btn{min-height:30px;padding:4px 9px;font-size:12px;line-height:20px}
.feed-card-side .rank-research,.topic-grid .row-actions .btn[data-action="topic-add-production"]{background:var(--action-gradient);border-color:transparent;color:#fff;font-weight:500}
.feed-card-side .rank-research:hover,.topic-grid .row-actions .btn[data-action="topic-add-production"]:hover:not(:disabled){background:var(--action-gradient-hover);color:#fff;border-color:transparent;filter:none}
.topic-grid .row-actions .btn[data-action="topic-add-production"]{background:var(--production-gradient)}
.topic-grid .row-actions .btn[data-action="topic-add-production"]:hover:not(:disabled){background:var(--production-gradient-hover)}
.insight-directions{margin:7px 0 0;padding-left:17px;color:var(--ink);font-size:13px;line-height:1.65}
.insight-directions li+li{margin-top:7px}
.feed-snapshot-date{display:block;margin-top:7px;font-size:12px;color:var(--muted)}
@media(max-width:760px){.workspace-nav{gap:10px;margin-bottom:18px}.workspace-nav .tabs{width:auto;flex:1 1 auto}.feed-date-filter{flex-wrap:wrap}}

/* 观众反馈：列表仅新增紧凑预览，分析沿用右侧抽屉。 */
.feedback-preview{order:3;display:flex;align-items:center;gap:6px;min-width:0;margin:3px 0 0 31px;font-size:12px;line-height:22px;color:var(--muted)}
.feedback-open{flex:none;padding:0 3px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;border-radius:4px}
.feedback-open:hover{color:var(--ink);background:var(--fill)}
.emotion-tag{flex:none;padding:0 7px;border-radius:6px;background:var(--fill);color:var(--muted);font-size:11px;line-height:20px}
.feedback-status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feedback-demo{flex:none;margin-left:auto;font-size:11px;color:var(--muted)}
.feedback-report{margin-top:18px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.feedback-scope{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--fill);font-size:12px;color:var(--muted)}
.feedback-scope strong{display:block;color:var(--ink);font-weight:600;margin-bottom:5px}
.feedback-scope small{display:block;margin-top:6px;font-size:11px}
.feedback-section{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.feedback-section h3{font-size:15px;margin-bottom:8px}
.feedback-section>summary,.feedback-research>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.feedback-section>summary:focus-visible,.feedback-research>summary:focus-visible,.feedback-comments details>summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.feedback-emotions{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-top:12px}
.feedback-emotion>div:first-child{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.feedback-emotion>div:first-child span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.feedback-meter{height:5px;background:var(--fill);border-radius:4px;overflow:hidden;margin-top:5px}
.feedback-meter span{display:block;height:100%;background:var(--teal);border-radius:4px}
.feedback-trigger{margin-top:12px;padding:10px 12px;background:var(--fill);border-radius:10px;font-size:13px}
.feedback-findings{display:grid;gap:10px}
.feedback-findings article,.feedback-suggestion{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.feedback-finding-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.feedback-finding-head strong{font-weight:600}.feedback-finding-head>.muted{margin-left:auto}
.feedback-findings article>p,.feedback-expectation p{font-size:13px}
.feedback-evidence-link{font-size:12px;margin-top:6px;padding:2px 0;color:var(--teal);border-radius:4px}
.feedback-expectation{margin-top:12px}.feedback-expectation p{margin-top:5px}
.feedback-suggestion{margin-top:10px}.feedback-suggestion dl{display:grid;grid-template-columns:32px minmax(0,1fr);gap:5px 10px;font-size:13px;margin:8px 0 0}
.feedback-suggestion dt{color:var(--muted)}.feedback-suggestion dd{margin:0}
.feedback-comments>p{margin-top:8px}.feedback-comment{padding:14px 0;border-bottom:1px solid var(--line);outline-offset:3px}
.feedback-comment.is-evidence{background:var(--selected);border-radius:8px;padding-left:10px;padding-right:10px}
#feedbackEvidenceNote:empty{display:none}
.feedback-comment p{margin:7px 0;color:var(--ink);font-size:13px;white-space:pre-wrap}
.feedback-comment-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.feedback-comments details{margin-top:12px}.feedback-comments details>summary{cursor:pointer;font-size:13px;color:var(--muted)}
.feedback-research{margin:18px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.feedback-empty{padding:18px 0;color:var(--muted);font-size:13px}
@media(max-width:1150px){.feedback-preview{flex-wrap:wrap;gap:4px 6px}.feedback-status{flex:1 1 160px}.feedback-demo{margin-left:0}}
@media(max-width:560px){.feedback-emotions{grid-template-columns:1fr}.feedback-preview{margin-left:31px}.feedback-status{flex-basis:100%;order:1}.feedback-scope{padding:12px}.feedback-demo{margin-left:auto}}
.page-actions.actions-left{justify-content:flex-start;gap:10px;flex-wrap:wrap}
.spark-capture{display:block;width:100%;min-height:240px;resize:vertical;font:inherit;line-height:1.65;padding:16px}
.work-status-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}

function feedbackComments(feedback){
 const seen=new Set();return (Array.isArray(feedback?.comments)?feedback.comments:[]).filter(c=>{if(!c||!c.id||typeof c.text!=='string'||!c.text.trim()||seen.has(c.id))return false;seen.add(c.id);return true}).map(c=>({...c,emotions:Array.isArray(c.emotions)?c.emotions.filter(e=>typeof e==='string'&&e.trim()):[],likes:Number.isSafeInteger(c.likes)&&c.likes>=0?c.likes:null}));
}
function feedbackEmotions(feedback){
 const comments=feedbackComments(feedback).filter(c=>Array.isArray(c.emotions)&&c.emotions.length),counts=new Map();
 for(const c of comments)for(const name of new Set(c.emotions))counts.set(name,(counts.get(name)||0)+1);
 return [...counts].map(([name,count])=>({name,count,percent:Math.round(count/comments.length*100)})).sort((a,b)=>b.count-a.count);
}
function feedbackMissing(feedback){return feedback?.status==='empty'?'该日期确认无评论':feedback?.status==='failed'?'评论采集失败':feedback?.status==='pending'?'观众反馈待分析':'该日期评论未获取'}
function feedbackPreview(video){
 const f=video.audienceFeedback,emotions=feedbackEmotions(f).slice(0,2),ready=f?.status==='ready';
 return `<div class="feedback-preview"><button class="feedback-open" data-action="feedback-open" data-id="${esc(video.id)}" aria-label="查看${esc(video.title||'该内容')}的观众反馈">观众反馈 ›</button>${ready?emotions.map(e=>`<span class="emotion-tag">${esc(e.name)}</span>`).join(''):''}${ready?'':`<span class="feedback-status">${esc(feedbackMissing(f))}</span>`}</div>`;
}
function feedbackEvidenceLink(refs,comments){
 const valid=(Array.isArray(refs)?refs:[]).filter(i=>comments[i]);
 return valid.length?`<button class="feedback-evidence-link" data-action="feedback-evidence" data-id="${valid.join(',')}">查看${valid.length}条证据 ›</button>`:'<span class="small muted">支持评论未获取</span>';
}
function feedbackReport(feedback,showKeyFeedback=false){
 if(!feedback)return `<p class="feedback-empty">${feedbackMissing(feedback)}</p>`;
 const comments=feedbackComments(feedback),emotions=feedbackEmotions(feedback),classified=comments.filter(c=>c.emotions?.length).length;
 if(!comments.length)return `<p class="feedback-empty">${feedback.status==='ready'?'暂无有效评论样本，暂不分析':feedbackMissing(feedback)}</p>`;
 const supported=rows=>(Array.isArray(rows)?rows:[]).filter(row=>Array.isArray(row)&&Array.isArray(row.at(-1))).map(row=>[...row.slice(0,-1),[...new Set(row.at(-1))].filter(i=>Number.isInteger(i)&&comments[i])]).filter(row=>row.at(-1).length);
 const top=comments.map((c,i)=>({...c,index:i})).sort((a,b)=>(b.likes??-1)-(a.likes??-1)).slice(0,5),topIds=new Set(top.map(c=>c.id));
 const remaining=comments.map((c,i)=>({...c,index:i})).filter(c=>!topIds.has(c.id));
 const renderComment=(c,rank)=>`<article class="feedback-comment" id="feedback-comment-${c.index}" tabindex="-1"><div class="feedback-comment-meta"><span>${rank?`TOP ${rank} · `:''}${esc(c.user||'匿名观众')} · ${esc(c.kind||'评论')}</span><span>赞 ${compactNum(c.likes)}</span></div><p>${esc(c.text)}</p><div class="feedback-comment-meta"><span>${esc(c.publishedAt||'发布时间未获取')}</span><span>${(c.emotions||[]).map(esc).join(' · ')||'未分类'}</span></div></article>`;
 const scope=comments.every(c=>c.kind==='热评')?'仅热评样本，不代表整体观众':'热评与普通评论混合样本，不代表整体观众';
 return `<div class="feedback-report"><div class="feedback-scope"><strong>${feedback.demo?'虚构演示 · 未调用AI':'已保存的观众反馈'}</strong><p>${esc(feedback.platform||'平台未获取')} · 情报日期 ${esc(feedback.sourceDate||'未获取')} · ${esc(feedback.capturedAt||'采集时间未获取')}</p><p>作品评论 ${compactNum(feedback.totalComments)} · 已采集 ${Array.isArray(feedback.comments)?feedback.comments.length:0} 条 · 有效 ${comments.length} 条 · 已分类 ${classified} 条</p><p>${scope}。归纳与建议为待验证观察，不自动形成正式规律。</p><small>${esc(feedback.id||'快照ID未获取')} · v${esc(feedback.version||'未获取')}</small></div><section class="feedback-section"><h3>情绪分布</h3><p class="small muted">占已分类样本的比例；同一评论可有多个情绪标签，占比合计可能超过100%。</p><div class="feedback-emotions">${emotions.map(e=>`<div class="feedback-emotion"><div><span>${esc(e.name)}</span><span>${e.count} 条 · ${e.percent}%</span></div><div class="feedback-meter" aria-hidden="true"><span style="width:${e.percent}%"></span></div>${feedback.emotionTriggers?.[e.name]?`<p class="small muted">触发：${esc(feedback.emotionTriggers[e.name])}</p>`:''}${feedbackEvidenceLink(comments.map((c,i)=>c.emotions?.includes(e.name)?i:null).filter(i=>i!==null),comments)}</div>`).join('')||'<p class="small muted">暂无情绪分类，不能推断情绪占比。</p>'}</div>${showKeyFeedback?`<p class="feedback-trigger">关键反馈：${esc(feedback.summary||'尚未归纳')}</p>`:''}</section><section class="feedback-section"><h3>受欢迎点与问题点</h3><div class="feedback-findings">${supported(feedback.findings).map(([type,aspect,text,refs])=>`<article><div class="feedback-finding-head"><span class="tag">${esc(type)}</span><strong>${esc(aspect)}</strong><span class="small muted">${refs.length>1?'重复反馈':'个别意见'}</span></div><p>${esc(text)}</p>${feedbackEvidenceLink(refs,comments)}</article>`).join('')||'<p class="small muted">证据不足，尚无可展示的归纳。</p>'}</div></section><section class="feedback-section"><h3>观众期待</h3>${supported(feedback.expectations).map(([type,text,refs])=>`<article class="feedback-expectation"><span class="tag">${esc(type)}</span><p>${esc(text)}</p>${feedbackEvidenceLink(refs,comments)}</article>`).join('')||'<p class="small muted">暂无有证据支持的观众期待。</p>'}</section><section class="feedback-section"><h3>创作建议</h3><p class="small muted">依据较弱 · 小样本假设；需人工判断与新版本验证。</p>${supported(feedback.suggestions).map(([priority,stage,reason,change,verify,refs])=>`<article class="feedback-suggestion"><div class="feedback-finding-head"><span class="tag">${esc(priority)}</span><strong>${esc(stage)}</strong><span class="small muted">待验证</span></div><dl><dt>反馈</dt><dd>${esc(reason)}</dd><dt>调整</dt><dd>${esc(change)}</dd><dt>验证</dt><dd>${esc(verify)}</dd></dl>${feedbackEvidenceLink(refs,comments)}</article>`).join('')||'<p class="small muted">证据不足，暂不给出创作建议。</p>'}</section><details class="feedback-section feedback-comments" id="feedbackComments"><summary>TOP评论 · ${top.length}条</summary><p id="feedbackEvidenceNote" class="small muted" role="status"></p><p class="small muted">已采集样本按点赞排序，非全站排名。原始正文仅作反馈证据。</p>${top.map((c,i)=>renderComment(c,i+1)).join('')}${remaining.length?`<details id="feedbackOtherComments"><summary>其他样本 · ${remaining.length}条</summary>${remaining.map(c=>renderComment(c)).join('')}</details>`:''}</details></div>`;
}
let feedbackContext=null;

function revealFeedbackEvidence(value){

 const other=document.getElementById('feedbackOtherComments');if(other)other.open=true;

 for(const index of refs)document.getElementById('feedback-comment-'+index)?.classList.add('is-evidence');

function feedPage(list,key){
 const pages=Math.max(1,Math.ceil(list.length/feedPageSize));
 state[key]=Math.min(Math.max(1,state[key]),pages);
 return {rows:list.slice((state[key]-1)*feedPageSize,state[key]*feedPageSize),page:state[key],pages};

let feedTextSource=null,feedTextDescription=null,feedTextHideTimer;
function hideFeedFullText(){
 clearTimeout(feedTextHideTimer);
 const box=document.getElementById('feedTextPopover');box.hidden=true;box.textContent='';
 if(feedTextSource){if(feedTextDescription===null)feedTextSource.removeAttribute('aria-describedby');else feedTextSource.setAttribute('aria-describedby',feedTextDescription)}
 feedTextSource=null;feedTextDescription=null;
}
function showFeedFullText(source){
 clearTimeout(feedTextHideTimer);
 if(!source?.isConnected||!(source.scrollWidth>source.clientWidth||source.scrollHeight>source.clientHeight)){hideFeedFullText();return}
 if(feedTextSource!==source){hideFeedFullText();feedTextSource=source;feedTextDescription=source.getAttribute('aria-describedby')}
 const box=document.getElementById('feedTextPopover'),rect=source.getBoundingClientRect(),margin=12,gap=8;
 const width=window.innerWidth,height=window.innerHeight;
 const below=Math.max(0,height-rect.bottom-gap-margin),above=Math.max(0,rect.top-gap-margin),placeBelow=below>=Math.min(360,above);
 box.textContent=source.dataset.feedFullText;box.style.maxHeight=Math.min(360,Math.max(1,placeBelow?below:above))+'px';box.hidden=false;
 box.style.left=Math.max(margin,Math.min(rect.left,width-box.offsetWidth-margin))+'px';
 box.style.top=Math.max(margin,Math.min(placeBelow?rect.bottom+gap:rect.top-gap-box.offsetHeight,height-box.offsetHeight-margin))+'px';
 source.setAttribute('aria-describedby',[feedTextDescription,'feedTextPopover'].filter(Boolean).join(' '));
}
function deferHideFeedFullText(){
 clearTimeout(feedTextHideTimer);feedTextHideTimer=setTimeout(()=>{
  const box=document.getElementById('feedTextPopover');
  if(document.activeElement!==feedTextSource&&!box.contains(document.activeElement))hideFeedFullText();
 },150);
}

}
function feedViewFilter(){return `<div class="feed-view-filter" role="group" aria-label="情报类型">${[['rank','视频'],['creator','博主'],['novel','小说']].map(([key,label])=>`<button data-action="feed-view" data-id="${key}" aria-pressed="${state.feedView===key}" class="${state.feedView===key?'active':''}">${label}</button>`).join('')}</div>`}
function feedSearch(){return `<label class="search feed-search">${icon('search')}<span class="sr-only">搜索当前工作区</span><input id="search" placeholder="${state.feedView==='novel'?'搜索小说、作者或内容简介':'搜索视频、博主或剧情简介'}" value="${esc(state.query)}" autocomplete="off"></label>`}

function migrateModelSources(){

 for(const source of db.modelConnections){if(active.includes(source))continue;(db.legacyModelConnections||=[]).push(structuredClone(source));changed=true}
 db.modelConnections=active;
 for(const [business,bindings] of Object.entries(db.modelBindings)){
  for(const [stage,sourceId] of Object.entries(bindings)){
   const required=modelStages.find(item=>item[0]===stage)?.[2],source=active.find(item=>item.id===sourceId);

 }

}

 if(![timeout,retries,maxTokens].every(Number.isSafeInteger)||timeout<1||timeout>600||retries<0||retries>3||maxTokens<1||maxTokens>131072||[values.timeout,values.retries,values.maxTokens].some(v=>!String(v??'').trim())){error.textContent='请检查超时、重试次数与输出长度的有效范围。';return}

let intakeWorkContext=null;
function normalizedWorkName(value){return (value||'').normalize('NFKC').trim().toLocaleLowerCase()}
function suggestedIntakeWork(video,pending,biz){
 if(biz!=='AI漫剧')return null;
 const works=db.works.filter(work=>work.biz?.includes('AI漫剧'));
 const linkedTask=db.research.find(task=>task.sourceId===video.id&&works.some(work=>work.id===task.workId));
 const stable=works.find(work=>work.id===(pending?.workId||video.workId))||works.find(work=>work.id===linkedTask?.workId)||works.find(work=>work.sourceId===video.id);
 if(stable)return stable;
 // Prototype pre-match only: no model is invoked and fuzzy titles never merge works.
 const clue=normalizedWorkName(video.workTitle||video.title);
 const matches=works.filter(work=>normalizedWorkName(work.title)===clue&&(!video.creatorId||!work.creatorId||video.creatorId===work.creatorId));
 return matches.length===1?matches[0]:null;
}

function intakeWorkKeydown(e){
 if(e.target?.id!=='reviewWorkName'||!intakeWorkContext)return false;
 const box=document.getElementById('reviewWorkOptions');
 if(e.key==='Escape'&&!box.hidden){closeIntakeWorkOptions();e.preventDefault();e.stopPropagation?.();return true}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){
  if(box.hidden)renderIntakeWorkOptions(e.target.value);
  const count=intakeWorkContext.options.length;if(!count)return false;
  const old=intakeWorkContext.active;
  if(old>=0)document.getElementById('reviewWorkOption-'+old).setAttribute('aria-selected','false');
  intakeWorkContext.active=(old+(e.key==='ArrowDown'?1:old<0?0:-1)+count)%count;
  const option=document.getElementById('reviewWorkOption-'+intakeWorkContext.active);option.setAttribute('aria-selected','true');option.scrollIntoView({block:'nearest'});
  e.target.setAttribute('aria-activedescendant',option.id);e.preventDefault();return true;
 }
 if(e.key==='Enter'&&!box.hidden&&intakeWorkContext.active>=0){e.preventDefault();chooseIntakeWork(intakeWorkContext.options[intakeWorkContext.active]);return true}
 if(e.key==='Tab')closeIntakeWorkOptions();
 return false;
}

function hasHumanReview(x){return !!(x.rating||x.learningText?.trim()||x.learningTags?.length)}
function humanReviewSnapshot(x){return structuredClone({rating:x.rating||'',learningTags:x.learningTags||[],learningText:x.learningText||'',genre:x.genre||'',biz:x.biz||[],sourceId:x.sourceId||'',sourceDate:x.sourceDate||'',submittedAt:x.submittedAt||'',taskId:x.id,version:x.version||1,title:x.title||'',totalEpisodes:x.totalEpisodes??null,episodeNumber:x.episodeNumber??null,workName:x.workName||'',workId:x.workId||''})}
