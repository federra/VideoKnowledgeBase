# Include inside the existing trusted HTTPS server block.
# Frontend build: vite build --base=/vkb/
location = /vkb {
    return 308 /vkb/;
}
location ^~ /vkb/api/ {
    proxy_pass http://127.0.0.1:18090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_cookie_path /api/v1 /vkb/api/v1;
    proxy_read_timeout 180s;
    proxy_buffering off;
    client_max_body_size 64m;
}
location ^~ /vkb/ {
    root /opt/video-knowledge-base/www;
    try_files $uri $uri/ /vkb/index.html;
    add_header X-Content-Type-Options nosniff always;
}
